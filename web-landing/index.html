<!DOCTYPE html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="./assets/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- SEO Meta Tags -->
    <title>KeyCare — Think before you send</title>
    <meta name="description" content="KeyCare is a Morocco-first AI communication layer for Darija, Arabic, French, English, Arabizi, and mixed-language messages." />
    <meta name="keywords" content="KeyCare, Darija, Arabizi, multilingual writing, Morocco, communication AI" />
    <meta name="author" content="KeyCare Team" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://key-care.app/" />
    <meta property="og:title" content="KeyCare — Think before you send" />
    <meta property="og:description" content="Improve, translate, calm, and understand multilingual messages while keeping your intent and control." />
    <meta property="og:image" content="https://key-care.app/assets/og.png" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://key-care.app/" />
    <meta property="twitter:title" content="KeyCare — Think before you send" />
    <meta property="twitter:description" content="A Morocco-first AI communication layer for Darija, Arabic, French, English, and Arabizi." />
    <meta property="twitter:image" content="https://key-care.app/assets/og.png" />
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    
    <!-- SPA Redirect Handler for GitHub Pages -->
    <script>
      (function() {
        const redirect = sessionStorage.getItem('redirect');
        if (redirect) {
          sessionStorage.removeItem('redirect');
          window.history.replaceState(null, null, redirect);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
